<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1390" viewBox="0 0 900 1390">
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#3f3f46"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#a1a1aa"/>
    </marker>
    <style>
      .file { font: 600 22px Arial, sans-serif; fill: #e4e4e7; }
      .text { font: 18px Arial, sans-serif; fill: #d4d4d8; }
      .small { font: 16px Arial, sans-serif; fill: #a1a1aa; }
      .card { fill: #202024; stroke: #71717a; stroke-width: 1.6; rx: 8; }
      .divider { stroke: #52525b; stroke-width: 1; }
      .path { fill: none; stroke: #a1a1aa; stroke-width: 2; marker-end: url(#arrow); }
      .icon { fill: none; stroke: #a1a1aa; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="900" height="1390" fill="#18181b"/>
  <rect width="900" height="1390" fill="url(#grid)"/>

  <a href="../source/run.py">
    <rect x="170" y="55" width="560" height="145" class="card"/>
    <line x1="170" y1="105" x2="730" y2="105" class="divider"/>
    <rect x="197" y="74" width="16" height="16" class="icon"/>
    <path d="M 202 74 V 90 M 208 74 V 90 M 197 79 H 213 M 197 85 H 213" class="icon"/>
    <text x="230" y="91" class="file">source/run.py</text>
    <text x="200" y="137" class="text">Запуск эксперимента</text>
    <text x="200" y="170" class="small">параметры, цикл обработки, сохранение результатов</text>
  </a>

  <a href="../source/data.py">
    <rect x="170" y="245" width="560" height="145" class="card"/>
    <line x1="170" y1="295" x2="730" y2="295" class="divider"/>
    <rect x="197" y="264" width="16" height="16" class="icon"/>
    <path d="M 202 264 V 280 M 208 264 V 280 M 197 269 H 213 M 197 275 H 213" class="icon"/>
    <text x="230" y="281" class="file">source/data.py</text>
    <text x="200" y="327" class="text">Подготовка эталона</text>
    <text x="200" y="360" class="small">загрузка, обрезка, размер 512 x 512</text>
  </a>

  <a href="../source/degradations.py">
    <rect x="170" y="435" width="560" height="145" class="card"/>
    <line x1="170" y1="485" x2="730" y2="485" class="divider"/>
    <rect x="197" y="454" width="16" height="16" class="icon"/>
    <path d="M 202 454 V 470 M 208 454 V 470 M 197 459 H 213 M 197 465 H 213" class="icon"/>
    <text x="230" y="471" class="file">source/degradations.py</text>
    <text x="200" y="517" class="text">Получение входа модели</text>
    <text x="200" y="550" class="small">уменьшение до 128 x 128 и добавление искажений</text>
  </a>

  <a href="../source/masks.py">
    <rect x="170" y="625" width="560" height="145" class="card"/>
    <line x1="170" y1="675" x2="730" y2="675" class="divider"/>
    <rect x="197" y="644" width="16" height="16" class="icon"/>
    <path d="M 202 644 V 660 M 208 644 V 660 M 197 649 H 213 M 197 655 H 213" class="icon"/>
    <text x="230" y="661" class="file">source/masks.py</text>
    <text x="200" y="707" class="text">Создание бинарной маски</text>
    <text x="200" y="740" class="small">0 сохранить область, 1 восстановить область</text>
  </a>

  <a href="../source/masked_sampler.py">
    <rect x="170" y="815" width="560" height="165" class="card"/>
    <line x1="170" y1="865" x2="730" y2="865" class="divider"/>
    <rect x="197" y="834" width="16" height="16" class="icon"/>
    <path d="M 202 834 V 850 M 208 834 V 850 M 197 839 H 213 M 197 845 H 213" class="icon"/>
    <text x="230" y="851" class="file">source/masked_sampler.py</text>
    <text x="200" y="897" class="text">Восстановление изображения</text>
    <text x="200" y="930" class="small">restore_full, весь кадр</text>
    <text x="200" y="958" class="small">restore_masked, маска на каждом шаге</text>
  </a>

  <a href="../source/metrics.py">
    <rect x="170" y="1025" width="560" height="145" class="card"/>
    <line x1="170" y1="1075" x2="730" y2="1075" class="divider"/>
    <rect x="197" y="1044" width="16" height="16" class="icon"/>
    <path d="M 202 1044 V 1060 M 208 1044 V 1060 M 197 1049 H 213 M 197 1055 H 213" class="icon"/>
    <text x="230" y="1061" class="file">source/metrics.py</text>
    <text x="200" y="1107" class="text">Оценка результата</text>
    <text x="200" y="1135" class="small">PSNR, outside MAE, LPIPS, CLIP-IQA</text>
    <text x="200" y="1158" class="small">evaluate.py дополняет metrics.csv</text>
  </a>

  <a href="../source/build_report.py">
    <rect x="170" y="1215" width="560" height="145" class="card"/>
    <line x1="170" y1="1265" x2="730" y2="1265" class="divider"/>
    <rect x="197" y="1234" width="16" height="16" class="icon"/>
    <path d="M 202 1234 V 1250 M 208 1234 V 1250 M 197 1239 H 213 M 197 1245 H 213" class="icon"/>
    <text x="230" y="1251" class="file">source/build_report.py</text>
    <text x="200" y="1297" class="text">Формирование отчёта</text>
    <text x="200" y="1330" class="small">чтение metrics.csv, таблицы и графики</text>
  </a>

  <path d="M 450 200 V 245" class="path"/>
  <path d="M 450 390 V 435" class="path"/>
  <path d="M 450 580 V 625" class="path"/>
  <path d="M 450 770 V 815" class="path"/>
  <path d="M 450 980 V 1025" class="path"/>
  <path d="M 450 1170 V 1215" class="path"/>
</svg>
